name: Build and Release APK

on:
  push:
    tags:
      - 'v*' # S'exécute automatiquement à chaque nouveau tag de version (ex: v1.0.0)
  workflow_dispatch: # Permet de lancer la compilation manuellement depuis GitHub

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # Requis pour créer une release GitHub

    steps:
      - name: 🏗 Setup repository
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🚀 Build APK
        # La compilation tourne sur l'infrastructure GitHub (--local) pour ne pas griller ta limite EAS
        # Et génère directement le fichier app-release.apk
        run: eas build --platform android --profile preview --local --non-interactive --output app-release.apk

      - name: 🏷 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app-release.apk
          generate_release_notes: true
